    <!-- 브라우저 UI 색은 셸을 따른다. manifest theme_color는 설치 타이틀바용이라
         --primary와 묶여 있어 건드리지 않는다(verify-pwa). -->
    <meta name="theme-color" content="hsl(40, 25%, 99%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(40, 12%, 7%)" media="(prefers-color-scheme: dark)" />

    <!--
      No static JSON-LD here on purpose. This shell is the template for every prerendered page
      (scripts/prerender.mjs), so a hardcoded WebApplication node was injected into all routes:
      every page carried two WebApplication entities, and the static one always pointed at the
      home url. Route-specific schema is emitted by prerender.mjs (crawlers) and useSEO.ts (SPA).
    -->
    <script>
      (() => {
        try {
          const key = "salary-calc:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // no-op
        }
      })();
    </script>
    <!-- Critical CSS: finance 테마 — 본문과 버튼에서 WCAG AA 대비 확보 -->
    <style>
      /* Archive 톤 — docs/ARCHIVE_TONE_SPEC.md가 단일 출처.
         --primary는 유지하고 쓰이는 자리만 줄인다(포커스·선택·상태). */
      :root {
        --background: 40 25% 99%;
        --foreground: 40 7% 12%;
        --muted: 36 14% 95%;
        --muted-foreground: 30 8% 38%;
        --card: 0 0% 100%;
        --card-foreground: 40 7% 12%;
        --primary: 160 62% 24%;
        --primary-foreground: 0 0% 100%;
        /* 브랜드 hue 틴트였다 — hover 워시·표 강조 행이 전부 연녹색이었다 */
        --secondary: 36 14% 93%;
        --secondary-foreground: 40 7% 12%;
        --accent: 36 14% 95%;
        --accent-foreground: 40 7% 12%;
        --popover: 0 0% 100%;
        --popover-foreground: 40 7% 12%;
        /* 0 72% 52%는 본문 배경 위 text-destructive가 4.49:1로 AA(4.5:1) 미달이었다. */
        --destructive: 0 74% 44%;
        --destructive-foreground: 40 25% 99%;
        /* Archive --line(#e6e2dd) 대응 헤어라인 */
        --border: 33 14% 87%;
        --input: 33 14% 87%;
        --ring: 160 62% 24%;
        --radius: 0.4rem;
        --deduction: 0 62% 52%;
        --deduction-foreground: 0 0% 100%;
        /* 프리렌더 h2 밑줄·안내 상자 테두리(장식) — 무채색 헤어라인 */
        --highlight: 33 10% 52%;
        --highlight-foreground: 40 7% 12%;
        /* 스티키 내비 높이 — scroll-padding의 단일 출처(모바일은 2행) */
        --header-h: 3rem;
      }

      @media (max-width: 639px) {
        :root { --header-h: 6.5rem; }
      }

      .dark {
        /* Archive dark: --bg #14120f, --fg #f3efe9, --muted #a49c93, --line #2e2a25 */
        --background: 40 12% 7%;
        --foreground: 39 29% 93%;
        --muted: 37 10% 15%;
        --muted-foreground: 32 12% 68%;
        --card: 38 10% 12%;
        --card-foreground: 39 29% 93%;
        --primary: 160 56% 56%;
        --primary-foreground: 160 56% 10%;
        --secondary: 37 9% 19%;
        --secondary-foreground: 39 29% 93%;
        --accent: 37 9% 18%;
        --accent-foreground: 39 29% 93%;
        --popover: 38 10% 12%;
        --popover-foreground: 39 29% 93%;
        /* 다크에서 적색 의미색은 "밝은 면 + 어두운 전경"이어야 AA를 넘는다.
           흰 전경을 유지한 채로는 배지(4.04:1)·본문(3.67:1) 어느 쪽도 통과할 수 없었다.
           함대 공통값 0 75% 72%는 민무늬 배경(6.91:1)에서만 충분했다. 이 앱은 허브 표의
           합계 행을 --accent로 틴트하는데, 그 위에서는 3.59:1로 AA 미달이었다(픽셀 실측).
           hue는 그대로 두고 명도만 올려 틴트 행에서 4.69:1, 민무늬에서 9.03:1을 확보한다. */
        --destructive: 0 82% 80%;
        --destructive-foreground: 0 60% 10%;
        --border: 37 13% 20%;
        --input: 37 13% 26%;
        --ring: 160 56% 56%;
        --deduction: 0 75% 72%;
        --deduction-foreground: 0 60% 10%;
        --highlight: 33 8% 48%;
        --highlight-foreground: 39 29% 93%;
      }

      html {
