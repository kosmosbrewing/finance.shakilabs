name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate production SBOM
        run: npm run sbom:prod

      # 오프라인·결정적 검증만 한다(SBOM 신원 + 벤더 tgz 해시). SBOM 재생성 diff는
      # timestamp·documentNamespace·npm 버전 때문에 상시 실패하므로 쓰지 않는다.
      - name: Verify supply chain metadata
        run: npm run verify:supply-chain

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom
          path: client/artifacts/sbom/*.json
